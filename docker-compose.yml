version: "3.8"
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # 🛑 Vite 는 VITE_* 를 **빌드 시점에** 번들에 박는다. 런타임
      #    environment 로 주면 안 들어간다. 그래서 build arg 로 넘긴다.
      #    Render 는 대시보드 환경변수를 build arg 로 자동 주입한다(공식).
      #    여기 기본값은 로컬 compose 기준이다 (.env.example 과 같이 둔다).
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
        VITE_PYTHON_URL: ${VITE_PYTHON_URL:-http://localhost:5000}
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend/mdggu-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
