# 빌드된 정적 파일을 3000 포트로 내보낸다.
#
# 🛑 포트를 3000 으로 두는 이유는 바꿀 수 없기 때문이다. 저장소 뿌리의
#    nginx/nginx.conf 가 `proxy_pass http://frontend:3000` 으로 이 컨테이너를
#    가리키고, docker-compose 도 "3000:3000" 으로 묶어 둔다. 80 으로 바꾸면
#    둘을 같이 고쳐야 하고, 한쪽을 놓치면 502 가 된다.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 🛑 SPA 라우팅. 이것이 없으면 /books/3 같은 주소를 새로 고칠 때 404 다.
    #    개발 서버에서는 vite 가 알아서 해 줘서 안 보이고, 정적 서빙으로
    #    바꾼 뒤에 드러난다. vite.config 의 `historyApiFallback` 은 애초에
    #    vite 옵션이 아니라 아무 일도 하지 않았다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 자산은 오래 캐시해도 안전하다 (내용이 바뀌면 이름이 바뀐다)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 🛑 index.html 은 캐시하지 않는다. 캐시하면 새 배포 뒤에도 옛 자산
    #    이름을 가리키는 HTML 이 남아 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
